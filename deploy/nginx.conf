# Dedicated FaceMood listener. Existing 80/443 website is unchanged.
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name 106.53.199.187;
    root /var/www/facemood/current;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/106.53.199.187/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/106.53.199.187/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    gzip on;
    gzip_types application/wasm application/javascript application/json text/css;
    location / { try_files $uri $uri/ =404; }
    location = /models/active.json {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    # ORT loads its WASM glue as a JavaScript module; Debian's default MIME table omits mjs.
    location ~* \.mjs$ {
        default_type application/javascript;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location ~* \.(html|js|mjs|css|webmanifest)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
}
